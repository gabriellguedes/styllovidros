<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senha Alterada - Styllo Vidros</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { margin-top: 0; color: #333; }
        h2 span { color: #007bff; }
        p { color: #555; margin-bottom: 20px; }
        .btn-login { display: inline-block; padding: 10px 20px; background-color: #007bff; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .btn-login:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="card">
        <h2>STYLLO <span>VIDROS</span></h2>
        <p>Sua senha foi redefinida com sucesso!</p>
        <!-- Altere a URL abaixo para o endereço do seu frontend React -->
