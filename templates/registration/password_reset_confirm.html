<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Senha - Styllo Vidros</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { margin-top: 0; color: #333; text-align: center; }
        h2 span { color: #007bff; }
        p { color: #666; font-size: 0.9rem; text-align: center; }
        input[type="password"] { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="card">
        <h2>STYLLO <span>VIDROS</span></h2>
        {% if validlink %}
            <p>Digite a sua nova senha abaixo:</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Redefinir Senha</button>
            </form>
        {% else %}
            <p style="color: red;">O link de redefinição de senha é inválido ou expirou. Por favor, solicite uma nova redefinição.</p>
        {% endif %}
    </div>
</body>
</html>
